schema_version: "3.0.0"
workflow_id: "mathematical-model"
version: "3.0.0"
description: "数学建模竞赛标准工作流 v3.0.0：用子工作流架构替代多级 parallel.source 链条，per-question 独立 worktree 隔离求解"
max_parallel_agents: 6
anchor_prefix: "wf"

stages:
  # ============================================================
  # 虚拟起止节点
  # ============================================================
  - stage_id: s00-workflow-start
    name: "工作流启动"

  - stage_id: s99-workflow-end
    name: "工作流终止"

  # ============================================================
  # p0 初始化
  # ============================================================
  - stage_id: p0-init
    name: "初始化"
    skill_id: init
    mandatory: true
    confirmation_point: false

  # ============================================================
  # p1a 选题阶段（2 个确认点）
  # ============================================================
  - stage_id: p1a-ambiguity-scan
    name: "歧义扫描"
    skill_id: topic-analyst
    mandatory: true
    confirmation_point: true

  - stage_id: p1a-topic-analysis
    name: "选题分析"
    skill_id: topic-analyst
    mandatory: true
    confirmation_point: true

  # ============================================================
  # p1b 小问分析 + 数据侦察（per-question 并行，无确认点）
  # ============================================================
  - stage_id: p1b-problem-analysis
    name: "小问分析"
    skill_id: problem-decomposer
    mandatory: true
    confirmation_point: false
    parallel:
      source: p1a-topic-analysis
      max_instances: 6

  - stage_id: p1b-data-exploration
    name: "数据侦察"
    skill_id: data-scout
    mandatory: true
    confirmation_point: false
    retry: 1
    parallel:
      source: p1b-problem-analysis
      max_instances: 6

  # ============================================================
  # p1c 依赖分析（全局汇聚，无确认点）
  # ============================================================
  - stage_id: p1c-dependency-analysis
    name: "依赖分析"
    skill_id: dependency-analyst
    mandatory: true
    confirmation_point: false

  # ============================================================
  # p2 子工作流：per-question 完整求解
  # ============================================================
  - stage_id: p2-question-solution
    name: "小问求解"
    workflow: "question-solution@1.0.0"
    mandatory: true
    confirmation_point: false
    parallel:
      source: p1c-dependency-analysis
      max_instances: 6

  # ============================================================
  # p5 论文素材生成（全局汇聚确认）
  # ============================================================
  - stage_id: p5-paper-materializer
    name: "论文素材生成"
    skill_id: paper-materializer
    mandatory: true
    confirmation_point: true

edges:
  # ============================================================
  # 全局启动
  # ============================================================
  - from: s00-workflow-start
    to: p0-init
    condition: always

  - from: p0-init
    to: p1a-ambiguity-scan
    condition: success

  - from: p0-init
    to: s99-workflow-end
    condition: failure

  # ============================================================
  # p1a-ambiguity-scan 歧义扫描（硬门控确认）
  # ============================================================
  - from: p1a-ambiguity-scan
    to: p1a-topic-analysis
    condition: confirmed
    choice: "确认解读"

  - from: p1a-ambiguity-scan
    to: p1a-ambiguity-scan
    condition: rejected
    choice: "重新扫描"
    max_loop: 2

  - from: p1a-ambiguity-scan
    to: s99-workflow-end
    condition: loop_exceeded

  # ============================================================
  # p1a-topic-analysis 选题分析（全局确认，双 rejected 路由）
  # ============================================================
  - from: p1a-topic-analysis
    to: p1b-problem-analysis
    condition: confirmed
    choice: "确认继续"
    aggregation: all

  - from: p1a-topic-analysis
    to: p1a-topic-analysis
    condition: rejected
    choice: "重新分析"
    max_loop: 2

  - from: p1a-topic-analysis
    to: p1a-ambiguity-scan
    condition: rejected
    choice: "修正歧义"

  - from: p1a-topic-analysis
    to: s99-workflow-end
    condition: loop_exceeded

  # ============================================================
  # p1b 小问分析 → 数据侦察
  # ============================================================
  - from: p1b-problem-analysis
    to: p1b-data-exploration
    condition: success
    aggregation: all

  - from: p1b-problem-analysis
    to: s99-workflow-end
    condition: failure

  # ============================================================
  # p1b-data 数据侦察 → p1c 依赖分析（含数据不合格回退）
  # ============================================================
  - from: p1b-data-exploration
    to: p1c-dependency-analysis
    condition: success
    aggregation: all

  - from: p1b-data-exploration
    to: p1b-problem-analysis
    condition: failure
    choice: "数据不合格"
    max_loop: 2

  - from: p1b-data-exploration
    to: s99-workflow-end
    condition: failure

  - from: p1b-data-exploration
    to: s99-workflow-end
    condition: loop_exceeded

  # ============================================================
  # p1c 依赖分析 → 子工作流分流
  # ============================================================
  - from: p1c-dependency-analysis
    to: p2-question-solution
    condition: success

  - from: p1c-dependency-analysis
    to: s99-workflow-end
    condition: failure

  # ============================================================
  # p2 子工作流汇聚 → p5 论文生成
  # ============================================================
  - from: p2-question-solution
    to: p5-paper-materializer
    condition: success
    aggregation: all

  - from: p2-question-solution
    to: s99-workflow-end
    condition: failure

  # ============================================================
  # p5 论文素材生成（最终确认）
  # ============================================================
  - from: p5-paper-materializer
    to: s99-workflow-end
    condition: confirmed
    choice: "确认完成"

  - from: p5-paper-materializer
    to: p5-paper-materializer
    condition: rejected
    choice: "回退修改"
    max_loop: 1

  - from: p5-paper-materializer
    to: s99-workflow-end
    condition: loop_exceeded
