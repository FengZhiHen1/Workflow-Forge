schema_version: "3.0.0"
workflow_id: "adversarial-module-implementation"
version: "2.0.0"
max_parallel_agents: 2
# 注：v2.0.0 单实例内各路径串行执行，2 并发为多实例场景预留。
# 单实例并行化（新测试生成 ∥ 回归测试收集）留待后续迭代。
anchor_prefix: "wf"

# =============================================================================
# 对抗性模块实现流水线 v2.0.0
#
# 核心变更（v1.1.0 → v2.0.0）：
#   - 新增存量检测与 4 路增量路径（full/incremental/code_only/conflict）
#   - 差异分析失败的降级边 → full_implementation
#   - validate/fix/blindtest 的 loop_exceeded → s13-report（全收敛）
#   - init/contract/reverse/arbitrate 的 loop_exceeded → s99-workflow-end（终止）
#   - ISO 规则新增 ISO-005（逆向工程禁读测试）和 ISO-006（差异分析禁读测试）
#   - 并发上限从 2 提升到 4
#
# 已知限制（技术债务）：
#   - s10-blindtest 的 branch_target 多路分支出边（2 success + 2 failure）仍需编排器
#     解析 Skill Message 的 branch_target 字段做二次路由，非原生 schema 支持。
#     详见风险 R02。
# =============================================================================

stages:
  # ==================== 虚拟起止 ====================

  - stage_id: s00-workflow-start
    name: "工作流启动"

  - stage_id: s99-workflow-end
    name: "工作流终止"

  # ==================== 阶段零：存量检测与路径判定（v2.0.0 新增）====================

  - stage_id: s01-detect
    name: "存量制品检测"
    skill_id: existing-asset-detector
    mandatory: true
    confirmation_point: false
    retry: 1
    model: light
    timeout_seconds: 120
    description: >
      扫描模块目录，检测四类存量：
      (1) 设计文档——落地规范/设计文档/意图文档
      (2) 实现代码——源文件
      (3) 测试代码——对抗性测试文件
      (4) 契约文件——contract-expectations.md。
      输出存量检测报告 JSON（含各文件路径、修改时间、SHA256、完整性评级）。
      纯文件扫描与分类，无 AI 决策。检测脚本：detect_existing_assets.py。

  - stage_id: s02-path
    name: "增量路径判定"
    skill_id: incremental-path-determiner
    mandatory: true
    confirmation_point: true
    retry: 1
    model: light
    description: >
      基于 s01-detect 存量检测报告，应用自动判定规则推荐增量路径。
      自动规则（优先，无需用户确认）：
      - 有代码+有设计+无冲突 → incremental_update
      - 无代码 → full_implementation
      - 有代码+无设计 → code_only
      - 有代码+有设计+有冲突 → code_design_conflict
      确认点仅次在规则无法覆盖的边界情况时触发，向用户呈现检测结果和推荐路径。
      四路分支（通过 choice 路由）：
      - full_implementation：完整对抗流水线
      - incremental_update：差异驱动增量更新
      - code_only：逆向工程后补充设计文档与测试
      - code_design_conflict：差异仲裁后修正代码或设计
      参考 module-design-pipeline@1.1.0 的 s02-determine-incremental-path 模式。

  # ===========================================================================
  # 路径 1：full_implementation（完整实现）
  # 入口：s02-path choice="full_implementation"
  # 等价于 v1.1.0 的全量流水线，区别：
  #   - s01-init 拆分为 s03-full-init（契约冻结）独立阶段
  #   - s02-impl → s04-full-impl，s03-validate → s05-full-validate
  #   - s04-testgen → s06-full-testgen
  #   - s05-blindtest → s10-blindtest
  # ===========================================================================

  - stage_id: s03-full-init
    name: "环境就绪与契约冻结"
    skill_id: contract-initializer
    mandatory: true
    confirmation_point: true
    retry: 1
    model: light
    timeout_seconds: 300
    description: >
      等价于 v1.1.0 的 s01-init（core 模式）。
      环境检查（折叠为只读信息）→ 契约提取（含模糊边界显式仲裁）→
      契约冻结 → 执行计划预览。
      确认点精简为两个核心决策：
      (1) 契约完整性：覆盖 N 个公开函数、M 条参数约束、K 条状态约束
      (2) 执行计划可接受性。
      产出：contract-expectations.md。

  - stage_id: s04-full-impl
    name: "实现落地执行"
    skill_id: impl-executor
    mandatory: true
    confirmation_point: false
    retry: 2
    model: light
    timeout_seconds: 900
    exclusive: true
    description: >
      等价于 v1.1.0 的 s02-impl（模式 A：全量优雅实现）。
      解析设计文档 → 扫描现有代码 → 差异比对 → 按实现顺序编写代码
      （类型系统→数据契约→工具→原子功能→状态机→组合层→异常处理→依赖适配）→
      生成 function-signatures.json + pending-confirmations.md。
      ISO-001：禁止读取测试目录。

  - stage_id: s05-full-validate
    name: "实现输出验证"
    skill_id: impl-validator
    mandatory: true
    confirmation_point: true
    retry: 1
    model: light
    timeout_seconds: 120
    description: >
      等价于 v1.1.0 的 s03-validate。
      验证 function-signatures.json 格式与合规性 → 评估 pending-confirmations 风险等级。
      条件确认点——仅发现"重大风险"条目时触发：
      - 无重大风险：静默 DONE，直接流转到下游（success edge）
      - 有重大风险：触发确认点，用户可选择"接受"（confirmed）或"退回"（rejected）
      格式/合规不通过 → 退回 s04-full-impl（≤3 次）。
      风险可控项（中低风险）汇入 IMPLEMENTATION_NOTES.md。

  - stage_id: s06-full-testgen
    name: "对抗性测试生成"
    skill_id: test-generator
    mandatory: true
    confirmation_point: false
    retry: 2
    model: light
    timeout_seconds: 600
    exclusive: true
    description: >
      等价于 v1.1.0 的 s04-testgen（模式 A：全量生成）。
      解析契约 → P0(契约禁止输入)→P1(边界值)→P2(类型破坏)→P3(状态/时序破坏) 优先级生成。
      强制自检流水线（阻断级）：语法检查 → import 验证 → detect_green_seeking.py 趋绿扫描。
      ISO-002：绝对禁止读取实现源码。

  # ===========================================================================
  # 路径 2：incremental_update（增量更新）
  # 入口：s02-path choice="incremental_update"
  # 差异分析 → 增量契约 → 最小化修改实现 → 验证 → 增量测试
  # ===========================================================================

  - stage_id: s03-incr-diff
    name: "设计变更差异分析"
    skill_id: diff-arbitrator
    mandatory: true
    confirmation_point: false
    retry: 1
    model: light
    timeout_seconds: 300
    description: >
      模式 A：对比当前设计文档与已冻结的 contract-expectations.md，
      识别新增/修改/删除的接口契约条目。
      输出变更差异报告 JSON（差异类型、影响范围、建议方向）。
      若 contract-expectations.md 缺失或分析失败：降级为 full_implementation（failure edge → s03-full-init）。
      ISO-006：可同时读取代码和设计文档，但禁读测试代码。

  - stage_id: s04-incr-contract
    name: "增量契约更新"
    skill_id: contract-initializer
    mandatory: true
    confirmation_point: true
    retry: 1
    model: light
    timeout_seconds: 300
    description: >
      基于 s03-incr-diff 的差异报告，增量更新 contract-expectations.md（contract-update 模式）。
      仅更新变更条目，保留未变更条目的编号（确保下游引用稳定）。
      确认点向用户呈现契约变更摘要。
      产出：更新后的 contract-expectations.md。

  - stage_id: s05-incr-impl
    name: "增量实现更新"
    skill_id: impl-executor
    mandatory: true
    confirmation_point: false
    retry: 2
    model: light
    timeout_seconds: 600
    exclusive: true
    description: >
      模式 C（增量实现更新）：基于增量契约变更，最小化修改实现代码。
      优先修改现有文件，仅在职责不符或不存在时新建。
      ISO-001 变体：禁止读取测试目录。
      产出：修改后代码 + 增量 function-signatures 更新 + pending-confirmations-round-N.md。

  - stage_id: s06-incr-validate
    name: "增量实现验证"
    skill_id: impl-validator
    mandatory: true
    confirmation_point: true
    retry: 1
    model: light
    timeout_seconds: 120
    description: >
      同 s05-full-validate——条件确认点，针对增量变更做格式/合规验证。
      无重大风险时静默 DONE；有重大风险时触发确认点。

  - stage_id: s07-incr-test
    name: "增量测试更新"
    skill_id: test-generator
    mandatory: true
    confirmation_point: false
    retry: 2
    model: light
    timeout_seconds: 600
    exclusive: true
    description: >
      模式 C（增量测试更新）：基于增量契约变更，增量更新对抗性测试代码。
      保留覆盖未变更契约的现有测试，为新增/修改的契约条目补充测试。
      自检流水线（语法→导入→趋绿扫描）。
      ISO-002：禁止读取实现源码。

  # ===========================================================================
  # 路径 3：code_only（纯代码 → 逆向工程）
  # 入口：s02-path choice="code_only"
  # 逆向推导 → 契约生成 → 全量测试
  # ===========================================================================

  - stage_id: s03-code-reverse
    name: "逆向推导设计意图"
    skill_id: reverse-engineering-analyzer
    mandatory: true
    confirmation_point: true
    retry: 1
    model: light
    timeout_seconds: 900
    exclusive: true
    description: >
      从现有代码反向提取：公开函数签名、类型定义、异常处理、
      状态机、参数约束（从校验逻辑推断）。
      输出逆向设计文档草稿，存放于消费者项目 docs/功能设计/。
      确认点向用户呈现逆推结果（已推断 N 个公开函数、M 个接口契约），
      用户可确认、继续完善或放弃。
      ISO-005：逆向工程阶段禁止读取任何测试相关文件。

  - stage_id: s04-code-contract
    name: "从逆向结果生成契约"
    skill_id: contract-initializer
    mandatory: true
    confirmation_point: true
    retry: 1
    model: light
    timeout_seconds: 300
    description: >
      将逆向设计文档草稿转化为标准 contract-expectations.md（from-reverse 模式）。
      应用模糊边界显式仲裁（从代码行为推断约束，对模糊点做保守假设）。
      确认点向用户呈现契约：覆盖 N 个函数、M 条约束。

  - stage_id: s05-code-testgen
    name: "对抗性测试生成（code_only）"
    skill_id: test-generator
    mandatory: true
    confirmation_point: false
    retry: 2
    model: light
    timeout_seconds: 600
    exclusive: true
    description: >
      模式 A（全量生成）：基于逆向生成的契约，全量生成对抗性测试。
      自检流水线（语法→导入→趋绿扫描）。
      ISO-002：禁止读取实现源码。

  # ===========================================================================
  # 路径 4：code_design_conflict（差异仲裁）
  # 入口：s02-path choice="code_design_conflict"
  # 差异对比 → 仲裁 → 按裁决修正 → 验证 → 增量测试
  # ===========================================================================

  - stage_id: s03-conflict-diff
    name: "代码与设计差异对比"
    skill_id: diff-arbitrator
    mandatory: true
    confirmation_point: false
    retry: 1
    model: light
    timeout_seconds: 300
    description: >
      模式 B：对比实现代码的接口签名与设计文档的契约声明，识别差异：
      代码有但设计无、设计有但代码无、两者皆有但不一致。
      输出差异报告 JSON（差异类型、影响范围、建议裁决方向）。
      若分析失败：降级为 full_implementation（failure edge → s03-full-init）。
      ISO-006：可同时读取代码和设计文档（唯一打破隔离的阶段），但禁读测试代码。

  - stage_id: s04-conflict-arbitrate
    name: "差异仲裁"
    skill_id: diff-arbitrator
    mandatory: true
    confirmation_point: true
    retry: 1
    model: light
    timeout_seconds: 300
    description: >
      模式 C（复用 diff-arbitrator 实例，wfctl continue action 保持上下文）：
      逐条呈现差异项，提供裁决选项——以代码为准（更新设计文档）、
      以设计为准（修改代码）、人工裁定（用户指定方向）。
      确认点支持批量通过 + 逐条否决模式。
      ISO-006 继续生效。

  - stage_id: s05-conflict-resolve
    name: "按仲裁结果修正"
    skill_id: impl-executor
    mandatory: true
    confirmation_point: false
    retry: 2
    model: light
    timeout_seconds: 600
    exclusive: true
    description: >
      模式 C（增量修正）：按 s04-conflict-arbitrate 的仲裁结果执行修正：
      - 以代码为准 → 更新设计文档和 contract-expectations.md
      - 以设计为准 → 修改实现代码
      - 混合 → 分别执行。
      产出：修正后的代码/设计文档 + 仲裁执行记录。

  - stage_id: s06-conflict-validate
    name: "修正后验证"
    skill_id: impl-validator
    mandatory: true
    confirmation_point: true
    retry: 1
    model: light
    timeout_seconds: 120
    description: >
      同 s05-full-validate——条件确认点，验证修正后的代码合规性与契约一致性。

  - stage_id: s07-conflict-test
    name: "测试增量更新（冲突路径）"
    skill_id: test-generator
    mandatory: true
    confirmation_point: false
    retry: 2
    model: light
    timeout_seconds: 600
    exclusive: true
    description: >
      模式 C（增量测试更新）：基于仲裁后更新的契约，增量更新对抗性测试代码。
      自检流水线（语法→导入→趋绿扫描）。
      ISO-002：禁止读取实现源码。

  # ===========================================================================
  # 共享收敛区：盲测 → 修复循环 → 报告（全路径必经）
  # ===========================================================================

  - stage_id: s10-blindtest
    name: "盲测执行与分支判定"
    skill_id: blindtest-runner
    mandatory: true
    confirmation_point: true
    retry: 2
    model: light
    timeout_seconds: 600
    description: >
      等价于 v1.1.0 的 s05-blindtest。全路径收敛点。
      8 步流程：测试就绪检查 → 运行测试 → classify_failures.py 分类 + 人工复核 →
      分支信号判定 → 生成隔离失败摘要（validate_failure_summary.py 阻断级门控）→
      生成测试缺陷报告 → 进度输出 → 确认点上报。
      含退化检测、收敛停滞检测、用户提前终止、recontract 逃生舱。
      confirmation_point=true，SubAgent 上报 AWAITING_CONFIRM 含 branch_target，
      编排器将 branch_target 映射为 choice 后调用 wfctl confirm 实现确定性路由：
      - all-pass | max-rounds | stagnation | user-terminated → choice="all_pass"
      - fix_impl → choice="fix_impl"
      - fix_test → choice="fix_test"
      - recontract → choice="recontract"

  - stage_id: s11-fix-impl
    name: "实现代码修复"
    skill_id: impl-executor
    mandatory: true
    confirmation_point: false
    retry: 2
    model: light
    timeout_seconds: 600
    exclusive: true
    description: >
      等价于 v1.1.0 的 s06-fix（模式 B：最小化修复）。
      阅读 failure-summary-round-N.md（隔离版本）→ 按 case ID 排序修复优先级 →
      最小化修复（仅修改实现代码，每处修改对应一个 case ID）→
      输出 pending-confirmations-round-N.md。
      修复后流转回 s10-blindtest。
      ISO-003：仅读 failure-summary（隔离版），禁读测试代码。
      映射表命中后 continue（复用 s04-full-impl / s05-incr-impl / s05-conflict-resolve 的 SubAgent 实例）。

  - stage_id: s12-fix-test
    name: "测试缺陷修正"
    skill_id: test-generator
    mandatory: true
    confirmation_point: false
    retry: 2
    model: light
    timeout_seconds: 600
    exclusive: true
    description: >
      等价于 v1.1.0 的 s07-testfix（模式 B：修正测试）。
      阅读 test-defects-round-N.md → 修正测试代码 →
      自检流水线（语法→导入→趋绿扫描）。
      修正后流转回 s10-blindtest。
      ISO-004：仅读 test-defects（隔离版），禁读实现代码。
      映射表命中后 continue（复用 test-generator SubAgent 实例）。

  - stage_id: s13-report
    name: "最终报告与验收"
    skill_id: report-generator
    mandatory: true
    confirmation_point: true
    retry: 1
    model: light
    timeout_seconds: 300
    description: >
      等价于 v1.1.0 的 s08-report。全路径收敛点。
      最终全量测试运行 → 收集证据 → 契约一致性校验 → 隔离合规审计 →
      验收检查 → 生成 3 份文档：
      - adversarial-report.md（含场景类型和路径来源字段）
      - TESTING.md（运行命令说明）
      - IMPLEMENTATION_NOTES.md（增量场景含"变更范围"章节和"回归测试结果"章节）
      确认点：接受并结束 / 追加一轮修复。

# =============================================================================
# 流转边（共计 75 条）
# validate/fix/blindtest 的 loop_exceeded → s13-report（全收敛）
# init/contract/reverse/arbitrate 的 loop_exceeded → s99-workflow-end（终止）
# =============================================================================

edges:
  # -- s00 起始 --
  - from: s00-workflow-start
    to: s01-detect
    condition: always

  # -- s01 存量检测（非确认点）--
  - from: s01-detect
    to: s02-path
    condition: success
  # 检测失败不终止——s02-path 收到底线数据时默认推荐 full_implementation
  - from: s01-detect
    to: s02-path
    condition: failure

  # ===========================================================================
  # -- s02 增量路径判定（确认点，5 条出边：4 confirmed + 1 rejected）--
  # ===========================================================================
  - from: s02-path
    to: s03-full-init
    condition: confirmed
    choice: "full_implementation"
  - from: s02-path
    to: s03-incr-diff
    condition: confirmed
    choice: "incremental_update"
  - from: s02-path
    to: s03-code-reverse
    condition: confirmed
    choice: "code_only"
  - from: s02-path
    to: s03-conflict-diff
    condition: confirmed
    choice: "code_design_conflict"
  - from: s02-path
    to: s99-workflow-end
    condition: rejected
    choice: "放弃"

  # ===========================================================================
  # 路径 1：full_implementation edges
  # ===========================================================================

  # -- s03-full-init 环境就绪与契约冻结（确认点）--
  - from: s03-full-init
    to: s04-full-impl
    condition: confirmed
    choice: "确认"
  - from: s03-full-init
    to: s03-full-init
    condition: confirmed
    choice: "重做"
    max_loop: 2
    loop_counter_stage: s03-full-init
  - from: s03-full-init
    to: s99-workflow-end
    condition: rejected
    choice: "放弃"
  - from: s03-full-init
    to: s99-workflow-end
    condition: loop_exceeded

  # -- s04-full-impl 实现落地执行（非确认点）--
  - from: s04-full-impl
    to: s05-full-validate
    condition: success
  - from: s04-full-impl
    to: s99-workflow-end
    condition: failure

  # -- s05-full-validate 实现输出验证（条件确认点）--
  - from: s05-full-validate
    to: s06-full-testgen
    condition: success
  - from: s05-full-validate
    to: s06-full-testgen
    condition: confirmed
    choice: "接受"
  - from: s05-full-validate
