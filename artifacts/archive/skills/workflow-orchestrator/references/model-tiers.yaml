# 调度器全局模型档位映射表
# 放置路径：results/skills/workflow-orchestrator/references/model-tiers.yaml
#
# 职责：工作流只声明抽象档位（light/standard/heavy），调度器在启动 SubAgent 前
# 按当前运行平台读取本文件，解析为具体模型名并传入 Agent(model=...)。
#
# 新增平台时，在每个 tier 下增加对应平台键即可，无需修改工作流或 Skill。

default_platform: kimi-code

tiers:
  light:
    # 轻量档：草稿生成、格式化、简单数据提取、测试运行等低复杂度任务
    kimi-code: "kimi-k2.6"
    claude-code: "deepseek-v4-flash"

  standard:
    # 标准档：常规编码、分析、审查、文档更新等中等复杂度任务
    # Kimi Code CLI 当前仅支持单一模型 kimi-k2.6，档位在此平台视为无差别映射
    kimi-code: "kimi-k2.6"
    claude-code: "deepseek-v4-pro[1m]"

  heavy:
    # 重档：复杂架构设计、深度推理、对抗验证、核心重构等高复杂度任务
    # Kimi Code CLI 当前仅支持单一模型 kimi-k2.6，档位在此平台视为无差别映射
    kimi-code: "kimi-k2.6"
    claude-code: "deepseek-v4-pro[1m]"
